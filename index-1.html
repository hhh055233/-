<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מבחן הדף</title>
<style>
:root{--bg:#f7f3ea;--card:#fff;--tx:#2b2418;--ac:#7a4b12;--ok:#2e7d32;--bad:#c62828;--mu:#8a7f6d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1812;--card:#2a241b;--tx:#f1e9d8;--ac:#e0a458;--mu:#a69b86}}
:root[data-theme="dark"]{--bg:#1c1812;--card:#2a241b;--tx:#f1e9d8;--ac:#e0a458;--mu:#a69b86}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Arial,sans-serif;max-width:560px;margin:auto;padding:14px}
h1{font-size:22px;margin:4px 0 12px}.c{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0002}
input,textarea,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--mu);background:var(--bg);color:var(--tx);font-size:16px;margin:6px 0}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px;font-size:16px;width:100%;margin:5px 0}
button.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}button:disabled{opacity:.5}
.o{display:block;text-align:right;background:var(--bg);color:var(--tx);border:1px solid var(--mu)}
.o.ok{background:var(--ok);color:#fff}.o.bad{background:var(--bad);color:#fff}
.row{display:flex;gap:8px}.mu{color:var(--mu);font-size:14px}.bar{display:flex;justify-content:space-between;font-weight:700}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--ac);color:#fff;font-size:13px}
</style></head><body>
<h1>📖 מבחן הדף</h1>
<div id="app"></div>
<script>
const LV={"קל":10,"בינוני":20,"קשה":30,"סכנה 🔥":50};
const $=s=>document.querySelector(s),app=$("#app");
let db,user,sample,room,owner=false;
let S={pts:Math.max(0,Number(ls("pts")||0)||0),opp:null,code:null,r:null,asked:readAsked()};
function readAsked(){try{const a=JSON.parse(ls("asked")||"[]");return Array.isArray(a)?a.filter(x=>typeof x==="string").slice(-100):[]}catch(e){return []}}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function init(){
 try{
  if(typeof claude!=="undefined"){
   user=await claude.use("user");owner=!!(user?.isOwner?.());
   db=await claude.use("db");sample=await claude.use("sample");room=await claude.use("room");
  }
 }catch(e){console.warn("חלק משירותי האפליקציה לא זמינים",e)}
 const saved=ls("code");
 if(owner&&db)return home();
 if(saved&&await valid(saved))return home();
 gate(!db?"שירות הכניסה אינו זמין כרגע. נסו שוב מאוחר יותר.":"");
}
function randomCode(length){const chars="abcdefghjkmnpqrstuvwxyz23456789";let out="";try{const a=new Uint32Array(length);crypto.getRandomValues(a);for(const n of a)out+=chars[n%chars.length]}catch(e){for(let i=0;i<length;i++)out+=chars[Math.floor(Math.random()*chars.length)]}return out}
async function valid(c){if(!db||typeof c!=="string"||!c||c.length>80)return false;try{const d=await db.doc("codes/"+c).get();const v=d?.exists?d.data():null;return !!v&&Number.isFinite(Number(v.exp))&&Number(v.exp)>Date.now()}catch(e){console.warn("בדיקת סיסמה נכשלה",e);return false}}
function gate(msg=""){
 app.innerHTML=`<div class="c"><b>כניסה למבחן הדף</b><p class="mu">האפליקציה מיועדת למי שקיבל סיסמה אישית מהמנהל. אם עדיין אין לך סיסמה, פנה למי שהזמין אותך.</p>
 <form id="loginForm"><input id="cd" placeholder="הזינו את הסיסמה שקיבלתם" autocomplete="off" autocapitalize="none" spellcheck="false" required><button id="go" type="submit">כניסה</button></form><div role="alert" style="color:var(--bad)">${esc(msg)}</div></div>`;
 $("#loginForm").onsubmit=async e=>{e.preventDefault();const c=$("#cd").value.trim();const btn=$("#go");btn.disabled=true;btn.textContent="בודק…";
  if(await valid(c)){ls("code",c);home()}else gate(!db?"שירות הכניסה אינו זמין כרגע.":"הסיסמה לא תקפה או שפג תוקפה.");
 };
}
function home(){
 app.innerHTML=`<div class="c bar"><span>⭐ ${S.pts} נקודות</span><span class="pill">${owner?"מנהל":"משתמש מורשה"}</span></div>
 <div class="c"><button class="g" id="logout">יציאה מהחשבון</button></div>
 <div class="c"><b>מה למדת?</b>
 <textarea id="pg" rows="2" placeholder="למשל: ברכות ב, ברכות ג"></textarea>
 <select id="lv">${Object.keys(LV).map(k=>`<option>${k}</option>`).join("")}</select>
 <button id="solo">🎯 מבחן אישי (10 שאלות)</button>
 <button class="g" id="duel">⚔️ צור דו-קרב</button>
 <div class="row"><input id="jc" placeholder="קוד דו-קרב"><button class="g" id="join" style="width:auto">הצטרף</button></div>
 <p class="mu">השאלות נוצרות בעזרת AI. יצירה אוטומטית אינה מבטיחה דיוק מלא, ולכן כדאי לבדוק את המקור והתשובות.</p></div>
 ${owner&&db?`<div class="c"><b>ניהול סיסמאות</b><p class="mu">צור קוד גישה למי שהזמנת. תוקף הקוד: 30 יום.</p>
 <button id="mk" class="g">צור סיסמה ל-30 יום</button><div id="nc" style="font-weight:700;overflow-wrap:anywhere"></div><div id="merr" role="alert" style="color:var(--bad)"></div></div>`:""}`;
 $("#logout").onclick=()=>{ls("code","");location.reload()};
 $("#solo").onclick=()=>start(false);$("#duel").onclick=()=>start(true);
 $("#join").onclick=()=>joinDuel($("#jc").value.trim().toLowerCase());
 if(owner&&db)$("#mk").onclick=async()=>{
  const btn=$("#mk"),out=$("#nc"),err=$("#merr");btn.disabled=true;err.textContent="";
  try{const c="p"+randomCode(10);await db.doc("codes/"+c).set({type:"p",exp:Date.now()+30*864e5,createdAt:Date.now()});out.textContent="הסיסמה החדשה: "+c+" — העתק ושלח למשתמש."}
  catch(e){err.textContent="לא הצלחתי לשמור את הסיסמה. בדוק חיבור למסד הנתונים והרשאות מנהל.";console.error(e)}
  finally{btn.disabled=false}
 };
}
async function gen(){
 const pg=$("#pg")?.value.trim(),lv=$("#lv")?.value;
 if(!pg){alert("הכניסו מסכת ודף גמרא, למשל: ברכות ב");return null}
 if(!sample||typeof sample.json!=="function"){alert("יצירת השאלות אינה זמינה בסביבת ההרצה הזאת.");return null}
 app.innerHTML=`<div class="c" role="status">מכין שאלות על ${esc(pg)}…</div>`;
 const prompt=`אתה בוחן בגמרא. חבר בדיוק 10 שאלות אמריקאיות בעברית על הדפים: ${pg}. רמת קושי: ${lv}.
כללים: אל תטען שבדקת את ספריא אם לא ניגשת בפועל למקור. השתמש רק במידע שאתה בטוח בו; אם אינך בטוח, החזר {"error":"סיבה"}.
שאלות חדשות ושונות מאלה שכבר נשאלו: ${JSON.stringify(S.asked.slice(-40))}. מזהה גיוון: ${Math.random()}.
בקל: עובדות והבנה בסיסית. בינוני: הבנת הסוגיא. קשה: ניואנסים, רש"י ותוספות. סכנה: שאלות עמוקות ומתעתעות.
החזר JSON בלבד: {"questions":[{"q":"","options":["","","",""],"answer":0,"explain":"הסבר קצר","source":"מסכת ודף, אם ידוע"}]}`;
 try{
  const r=await sample.json(prompt);
  if(r?.error){alert("לא הצלחתי להכין מבחן: "+String(r.error));home();return null}
  const qs=Array.isArray(r?.questions)?r.questions:null;
  if(!qs||qs.length!==10||qs.some(q=>!q||typeof q.q!=="string"||!q.q.trim()||!Array.isArray(q.options)||q.options.length!==4||q.options.some(o=>typeof o!=="string")||!Number.isInteger(q.answer)||q.answer<0||q.answer>3)){
   alert("ה-AI החזיר שאלות במבנה לא תקין. נסו שוב.");home();return null;
  }
  S.asked.push(...qs.map(q=>q.q.slice(0,50)));S.asked=S.asked.slice(-100);ls("asked",JSON.stringify(S.asked));return {qs,lv};
 }catch(e){console.error(e);alert("שגיאה ביצירת המבחן. בדקו חיבור ונסו שוב.");home();return null}
}
async function start(duel){
 const g=await gen();if(!g)return;
 if(duel){if(!room||typeof room.join!=="function"){alert("הדו-קרב אינו זמין כרגע בסביבת ההרצה.");home();return}const code=randomCode(4).toLowerCase();S.code=code;S.r=room.join("duel-"+code);
  app.innerHTML=`<div class="c">קוד הדו-קרב שלך:<h1>${code}</h1><p class="mu">שלחו אותו לחבר. ממתין ליריב…</p><button id="st" disabled>התחל</button></div>`;
  const go=()=>{$("#st").disabled=false};
  S.r.on("hello",go);S.r.onPeers(c=>{if(S.r.peers().length>1)go()});
  $("#st").onclick=async()=>{await S.r.emit("q",g);quiz(g,true)};return}
 quiz(g,false);
}
async function joinDuel(code){
 if(!/^[a-z0-9]{4}$/.test(code)||!room||typeof room.join!=="function")return alert("קוד לא תקין או ששירות הדו-קרב אינו זמין.");
 S.r=room.join("duel-"+code);app.innerHTML=`<div class="c">ממתין שהמארח יתחיל…</div>`;
 S.r.on("q",m=>quiz((m.data??m),true));await S.r.emit("hello",{});
}
function quiz(g,duel){
 let i=0,sc=0;S.opp=null;
 if(duel)S.r.on("s",m=>{const data=m?.data??m;if(Number.isFinite(data?.sc)){S.opp=data.sc;const e=$("#op");if(e)e.textContent="יריב: "+S.opp}});
 const per=LV[g.lv]||10;
 const show=()=>{const q=g.qs[i];
  app.innerHTML=`<div class="c"><div class="bar"><span>שאלה ${i+1}/${g.qs.length}</span><span>⭐ ${sc}</span>${duel?`<span id="op">יריב: ${S.opp??0}</span>`:""}</div>
  <p style="font-size:18px">${esc(q.q)}</p>${q.options.map((o,k)=>`<button class="o" data-k="${k}">${esc(o)}</button>`).join("")}<div id="ex"></div></div>`;
  document.querySelectorAll(".o").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;
   document.querySelectorAll(".o").forEach(x=>{x.disabled=true;if(+x.dataset.k===q.answer)x.classList.add("ok")});
   if(k===q.answer){sc+=per}else b.classList.add("bad");
   if(duel)S.r.emit("s",{sc});
   $("#ex").innerHTML=`<p class="mu">${esc(q.explain||"")}<br>📚 ${esc(q.source||"")}</p><button id="nx">${i+1<g.qs.length?"הבא":"סיום"}</button>`;
   $("#nx").onclick=()=>{i++;i<g.qs.length?show():end()}})};
 const end=()=>{S.pts+=sc;ls("pts",String(S.pts));
  const w=duel?(S.opp==null?"התוצאה של היריב עדיין לא התקבלה":sc>S.opp?"🏆 ניצחת!":sc<S.opp?"היריב ניצח":"תיקו"):"";
  app.innerHTML=`<div class="c"><h1>סיימת! ${esc(w)}</h1><p>קיבלת ${sc} נקודות (סה"כ ${S.pts})</p><p>ענית נכון על ${Math.round(sc/per)} מתוך ${g.qs.length} שאלות.</p><button id="hm">חזרה</button></div>`;$("#hm").onclick=home};
 show();
}
init();
</script></body></html>
